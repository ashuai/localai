# localai 配置 —— cordis 风格 loader:内核只负责插拔,能力全部来自插件
server:
  base_url: http://192.168.0.5:9870   # 本地 oMLX 服务器(OpenAI 兼容)
  api_key_env: LLM_API_KEY            # 从环境变量读 key(也可直接写 api_key 字段)
  default_model: Qwen3.6-35b          # 主模型(35b;Qwen3.5-27b 是 Claude 蒸馏模型,非必要不用)
  max_concurrent: 6                   # 微调用并发上限(服务器 max_concurrent_requests=12,留余量)
  timeout_secs: 120

plugins:
  - name: memory
    enabled: true
    options:
      memory_max_chars: 500           # 次级记忆预算(≈500~750 token;替代几千 token 原始轮次,净省)
      critical_max_items: 8           # 关键记忆条数上限(S 级,不计入预算)
      critical_reaudit: 6             # critical 重审门槛:条数≥6 时审计重审淘汰过时约束
      grace_turns: 3                  # 临时窗口:驱逐时最近 3 条豁免(防"刚说完就消失")
      trigger_turns: 6                # 距上次审计新增 6 轮触发全量审计
      history_turns: 6                # 近期原样保留轮数
      persist:
        dir: "default"                # "default"=跟随主程序(可执行文件目录);"~"=家目录

  - name: chat
    enabled: true
    options:
      model: Qwen3.6-35b
      enable_thinking: false          # 本地推理模型默认把思考过程混进 content;关闭后回复直接、JSON 干净
      history_turns: 6                # 上下文纪律(memory 插件未加载时的滑动窗口兜底)

  - name: subagent
    enabled: true
    options:
      max_rounds: 2                   # 子任务自检循环:1=单次直出;2=自检一轮
      parallel_limit: 3               # --parallel 上限(本地 AI 并发不是强项,克制)
      tools: false                    # 子任务默认不带工具;探索型任务主 agent 显式 --tools
      # model: Qwen3.6-35b            # 默认跟随主模型;--model 可切换(视觉→Qwen3.8-27B-4bit)

  - name: microtask
    enabled: true
    options:
      model: Qwen3.6-35b
      max_retries: 2                  # 微调用零成本 → 解析失败直接重试

  - name: tools
    enabled: true
    options:
      run_timeout_secs: 30              # /run 子进程超时;fs 策略见 main 装配(工作区边界+敏感文件)

  - name: tui
    enabled: true
    options: {}                        # 交互层插件:命令/事件全走 cordis 通道
