# localai 多平台构建 + 自动发布
#
# 触发规则(参照 ~/projects/CHAT/DSH/.github/workflows/rust.yml):
#   - 只有 changelog/ 出现新版本文件(或 workflow 自身变更)才自动构建发布;
#     平时改 src/、README 等不触发;
#   - 想随时手动构建:GitHub → Actions → Run workflow(workflow_dispatch)。
#
# 发布规则:
#   - 三平台构建都通过 → release job 读 changelog/ 最高版本号文件(vX.Y.Z.md);
#   - 对应 Release 已存在 → 自动跳过;不存在 → 创建,notes 用该 changelog 文件内容;
#   - 产物重命名为 localai-v<版本>-<平台>.* 后挂到 Release。

name: build

on:
  push:
    branches: [main]
    paths:
      - 'changelog/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 (win10+)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $dir = "localai-win-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/localai.exe $dir/
          Copy-Item localai.yml, .env.example, README.md $dir/
          Compress-Archive -Path $dir -DestinationPath localai-win-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: localai-win-x64
          path: localai-win-x64.zip

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="localai-macos-${{ matrix.arch }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/localai" "$dir/"
          cp localai.yml .env.example README.md "$dir/"
          tar czf "localai-macos-${{ matrix.arch }}.tar.gz" "$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: localai-macos-${{ matrix.arch }}
          path: localai-macos-${{ matrix.arch }}.tar.gz

  linux-centos:
    name: Linux x64 (CentOS 7+ compatible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # cross 的 x86_64-unknown-linux-gnu 镜像基于 CentOS 7(glibc 2.17),
      # 产物可在 CentOS 7/8/Stream、Rocky、AlmaLinux 等"centos-like"系统上直接运行
      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          dir="localai-linux-x64"
          mkdir -p "$dir"
          cp target/x86_64-unknown-linux-gnu/release/localai "$dir/"
          cp localai.yml .env.example README.md "$dir/"
          tar czf localai-linux-x64.tar.gz "$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: localai-linux-x64
          path: localai-linux-x64.tar.gz

  # 发布规则(参照 DSH):changelog/ 最高版本对应的 Release 不存在 → 发布;
  # 已存在 → 自动跳过,不会重复发版。
  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux-centos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Determine version from changelog
        id: ver
        run: |
          VERSION=$(ls changelog | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.md$' | sed -E 's/^v//; s/\.md$//' | sort -V | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "检测到版本: $VERSION"

      - name: Publish GitHub Release
        if: steps.ver.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} 已存在,跳过发布"
            exit 0
          fi
          # 产物重命名为 localai-v<版本>-<平台>
          cd artifacts
          for f in */localai-*; do
            mv "$f" "localai-v${VERSION}-$(basename "$f" | sed 's/^localai-//')"
          done
          cd ..
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "$(cat changelog/v${VERSION}.md)" \
            artifacts/localai-v${VERSION}-*
