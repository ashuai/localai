[package]
name = "localai"
version = "0.1.0"
edition = "2021"
description = "DSH 式 cordis 插件模式的 Rust 本地 LLM 壳:小上下文、零成本、频繁微调用"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
dotenvy = "0.15"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = true
